; The Cardputer's operating system.
;   build: pio run            flash: pio run -t upload
; The probe is a separate tiny firmware that reports what the board is:
;   pio run -e probe -t upload
[platformio]
default_envs = cardputer

[env]
platform = espressif32@6.7.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
upload_speed = 460800
upload_flags = --no-stub
monitor_speed = 115200
build_unflags = -Os
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -O2
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-misleading-indentation
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    bblanchon/ArduinoJson@^7.2.0

[env:cardputer]
build_src_filter = +<*> -<probe/>

[env:probe]
build_src_filter = +<probe/>
